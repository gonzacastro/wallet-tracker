[project]
name = "wallet-tracker"
version = "0.1.0"
description = "Seguimiento de tu cartera de inversiones: PPI y Binance en un solo lugar"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ppi-client>=1.2.4",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
wallet-tracker = "wallet_tracker.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallet_tracker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
